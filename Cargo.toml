[package]
name = "rodioplay"
version = "1.0.1"
edition = "2024"
description = "一个特别简单的音频播放器, 用于给作者研究 rodio 库"
readme = "README.md"
license = "MPL-2.0"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["string"] }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
ctrlc = "3.5"
ferris-says = "0.3"
rodio = { git = "https://github.com/RustAudio/rodio.git", default-features = false, features = ["64bit", "playback", "symphonia-all"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = "abort"
codegen-units = 16
